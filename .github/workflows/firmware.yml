# Eigener Workflow statt zmkfirmware/zmk/.github/workflows/build-user-config.yml:
# Dessen "west update" läuft im Hauptordner und findet den Arbeitsbereich nicht,
# wenn die Config wie hier in einem Unterordner liegt.
name: Firmware bauen

on:
  push:
    branches: [main]
    paths:
      - "3-Firmware-Quellcode-ZMK/build.yaml"
      - "3-Firmware-Quellcode-ZMK/config/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "build_matrix=$(yq -oj -I0 3-Firmware-Quellcode-ZMK/build.yaml)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: matrix
    # Dieses Image nutzt auch die CI von ZMK v0.3 (Zephyr 3.5)
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:3.5
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    defaults:
      run:
        working-directory: 3-Firmware-Quellcode-ZMK
    steps:
      - uses: actions/checkout@v4

      - name: West-Module cachen
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            3-Firmware-Quellcode-ZMK/modules/
            3-Firmware-Quellcode-ZMK/tools/
            3-Firmware-Quellcode-ZMK/zephyr/
            3-Firmware-Quellcode-ZMK/bootloader/
            3-Firmware-Quellcode-ZMK/zmk/
          key: west-${{ hashFiles('3-Firmware-Quellcode-ZMK/config/west.yml') }}

      - run: west init -l config
      - run: west update --fetch-opt=--filter=tree:0
      - run: west zephyr-export

      - name: Bauen (${{ matrix.shield }})
        run: west build -s zmk/app -d build -b "${{ matrix.board }}" -- -DZMK_CONFIG="$PWD/config" -DSHIELD="${{ matrix.shield }}"

      # Das Board hat keinen 32-kHz-Quarz, ohne RC-Takt erkennt es keine Tasten (siehe ANLEITUNG.md)
      - name: RC-Takt prüfen
        run: grep -x 'CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y' build/zephyr/.config

      - run: |
          mkdir artifacts
          cp build/zephyr/zmk.uf2 "artifacts/${{ matrix.shield }}-${{ matrix.board }}-zmk.uf2"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shield }}-${{ matrix.board }}-zmk
          path: 3-Firmware-Quellcode-ZMK/artifacts
